name: iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Generate, lint, and build
    runs-on: xcode-27
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned tools
        uses: jdx/mise-action@v4

      - name: Show toolchain versions
        run: |
          tuist version
          swiftlint version
          xcodebuild -version

      - name: Generate Xcode project
        run: tuist generate --no-open

      - name: Lint Swift sources
        run: swiftlint lint --strict --no-cache --quiet

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project Hopes.xcodeproj
          -scheme Hopes
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Run screen entry regression tests
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted([
              (tuple(map(int, re.findall(r"\d+", runtime))), runtime)
              for runtime in devices
              if runtime.startswith("iOS ") and tuple(map(int, re.findall(r"\d+", runtime))) >= (27, 0)
          ], reverse=True)
          for _, runtime in runtimes:
              simulator = next((device for device in devices[runtime] if device["name"] == "iPhone 17e"), None)
              if simulator:
                  print(simulator["udid"])
                  break
          else:
              raise SystemExit("No iOS 27 iPhone 17e simulator is available")
          ')
          xcodebuild \
            -project Hopes.xcodeproj \
            -scheme Hopes \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test
